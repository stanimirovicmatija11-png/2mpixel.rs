<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2MPIXEL — Digitalni zid Srbije</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #00f5c8; }
    body {
      font-family: 'Syne', system-ui, sans-serif;
      background: #04040a;
      color: #e0e0e0;
      overflow-x: hidden;
    }
    .bebas { font-family: 'Bebas Neue', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    #grid-wrapper {
      height: calc(100vh - 85px);
      border: 1px solid rgba(0, 245, 200, 0.25);
    }

    #canvas {
      image-rendering: pixelated;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* FLIP CARD - popravljeno */
    .flip-card {
      perspective: 1800px;
      position: absolute;
      width: 420px;
      height: 560px;
      z-index: 1000;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.8);
    }
    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border: 3px solid var(--accent);
      border-radius: 4px;
      overflow: hidden;
      background: #0a0a12;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="min-h-screen">

  <nav class="fixed top-0 left-0 right-0 z-50 border-b border-white/10 bg-black/95 backdrop-blur-md">
    <div class="max-w-screen-2xl mx-auto px-8 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl tracking-tighter bebas text-white">2MPIXEL</span>
        <span class="text-xs mono text-[#00f5c8]">SRBIJA</span>
      </div>
      <div class="mono text-sm">2.000.000 PIKSELA</div>
    </div>
  </nav>

  <div class="pt-16 h-screen" id="grid-wrapper">
    <canvas id="canvas" width="2000" height="1000"></canvas>
  </div>

  <!-- Flip Card -->
  <div id="flip-card" class="flip-card hidden">
    <div class="flip-card-inner">
      <div class="flip-card-front p-10 flex flex-col">
        <div id="front-content" class="flex-1"></div>
        <button onclick="flipCard()" 
                class="mt-6 text-sm mono border border-white/40 hover:border-[#00f5c8] px-10 py-5 rounded-2xl transition-all">
          PROČITAJ PRIČU →
        </button>
      </div>
      <div class="flip-card-back p-10 flex flex-col">
        <button onclick="closeCard()" class="self-end mb-6 text-gray-400 hover:text-white">✕ ZATVORI</button>
        <div id="back-content" class="flex-1"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let scale = 1.25;
    let offsetX = -150;
    let offsetY = -70;
    let isDragging = false;
    let lastX, lastY;

    const occupiedBlocks = [
      {x: 150, y: 120, w: 180, h: 110, color: '#00f5c8', name: "Pivara 011", city: "Beograd", desc: "Najbrže rastuća craft pivara u Srbiji."},
      {x: 720, y: 250, w: 260, h: 130, color: '#ff4d94', name: "CodeCrafters", city: "Novi Sad", desc: "Softver koji menja srpsko poslovanje."},
      {x: 1300, y: 140, w: 170, h: 170, color: '#00bfff', name: "Neural Balkans", city: "Novi Sad", desc: "Veštačka inteligencija za Balkan."},
    ];

    function draw() {
      ctx.fillStyle = '#04040a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Noise
      for (let i = 0; i < 18000; i++) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.07})`;
        ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 1, 1);
      }

      occupiedBlocks.forEach(block => {
        ctx.fillStyle = block.color + '22';
        ctx.fillRect(block.x, block.y, block.w, block.h);
        ctx.strokeStyle = block.color;
        ctx.lineWidth = 6;
        ctx.strokeRect(block.x, block.y, block.w, block.h);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px JetBrains Mono';
        ctx.fillText(block.name, block.x + 25, block.y + 60);
      });
    }

    // Mouse controls
    canvas.addEventListener('mousedown', e => {
      isDragging = true;
      lastX = e.offsetX;
      lastY = e.offsetY;
    });

    canvas.addEventListener('mousemove', e => {
      if (!isDragging) return;
      offsetX += (e.offsetX - lastX) / scale;
      offsetY += (e.offsetY - lastY) / scale;
      lastX = e.offsetX;
      lastY = e.offsetY;
      draw();
    });

    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.12;
      scale = Math.max(0.4, Math.min(8, scale * delta));
      draw();
    });

    // CLICK - najvažnije
    canvas.addEventListener('click', function(e) {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      for (let block of occupiedBlocks) {
        if (clickX > block.x && clickX < block.x + block.w && 
            clickY > block.y && clickY < block.y + block.h) {
          
          showCard(block, e.clientX, e.clientY);
          return;
        }
      }
    });

    function showCard(block, clientX, clientY) {
      const card = document.getElementById('flip-card');
      card.classList.remove('hidden');
      card.classList.remove('flipped');

      card.style.left = (clientX - 200) + 'px';
      card.style.top = (clientY - 250) + 'px';

      document.getElementById('front-content').innerHTML = `
        <div style="color: \( {block.color}" class="text-6xl mb-4"> \){block.name}</div>
        <div class="mono text-lg">${block.city}</div>
      `;

      document.getElementById('back-content').innerHTML = `
        <h3 class="bebas text-3xl mb-6">${block.name}</h3>
        <p class="text-gray-300 leading-relaxed">${block.desc}</p>
        <button onclick="window.open('https://example.com','_blank')" class="mt-8 bg-[#00f5c8] text-black px-8 py-4 rounded-2xl font-semibold">Poseti sajt →</button>
      `;
    }

    window.flipCard = () => document.getElementById('flip-card').classList.add('flipped');
    window.closeCard = () => document.getElementById('flip-card').classList.add('hidden');

    draw();
  </script>
</body>
</html>
