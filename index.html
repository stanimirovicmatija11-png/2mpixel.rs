<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2MPIXEL — Digitalni zid Srbije</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #00f5c8; }
    body {
      font-family: 'Syne', system-ui, sans-serif;
      background: #04040a;
      color: #e0e0e0;
      overflow-x: hidden;
    }
    .bebas { font-family: 'Bebas Neue', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    #grid-wrapper {
      max-height: 88vh;
      border: 1px solid rgba(0, 245, 200, 0.2);
      box-shadow: 0 0 60px -20px rgba(0, 245, 200, 0.15);
    }

    #canvas {
      image-rendering: pixelated;
      width: 100%;
      height: auto;
      max-height: 88vh;
      display: block;
    }

    .flip-card {
      perspective: 1400px;
      position: absolute;
      width: 400px;
      height: 520px;
      z-index: 100;
      pointer-events: none;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.95s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
      box-shadow: 0 30px 60px -15px rgb(0 0 0 / 0.6);
    }
    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border: 3px solid var(--accent);
      border-radius: 3px;
      overflow: hidden;
      background: #0a0a12;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- NAV -->
  <nav class="fixed top-0 left-0 right-0 z-50 border-b border-white/10 bg-black/90 backdrop-blur-md">
    <div class="max-w-screen-2xl mx-auto px-8 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl tracking-tighter bebas text-white">2MPIXEL</span>
        <span class="text-xs mono text-[#00f5c8] border border-[#00f5c8]/40 px-3 py-1">SRBIJA</span>
      </div>
      <div class="mono text-sm flex items-center gap-2">
        <div class="w-2 h-2 bg-[#00f5c8] rounded-full animate-pulse"></div>
        DIGITALNI ZID
      </div>
    </div>
  </nav>

  <!-- Minimal Hero -->
  <div class="pt-28 pb-6 px-8 text-center max-w-screen-2xl mx-auto">
    <h1 class="bebas text-6xl md:text-[5.2rem] leading-none tracking-[-3px] text-white">
      LJUDI<br>U KOJE<br>VERUJEMO.
    </h1>
    <p class="mt-4 text-gray-400 text-lg">2.000.000 piksela • Srpsko preduzetništvo</p>
  </div>

  <!-- GRID - glavni fokus -->
  <div class="max-w-screen-2xl mx-auto px-8 relative" id="grid-wrapper">
    <canvas id="canvas" width="2000" height="1000"></canvas>
  </div>

  <!-- Flip Card -->
  <div id="flip-card" class="flip-card hidden">
    <div class="flip-card-inner">
      <!-- Front -->
      <div class="flip-card-front p-8 flex flex-col">
        <div id="front-content" class="flex-1"></div>
        <button onclick="flipCard()" 
                class="mt-auto text-sm mono border border-white/30 hover:border-[#00f5c8] px-8 py-4 rounded-full transition-colors">
          PROČITAJ VIŠE →
        </button>
      </div>
      <!-- Back -->
      <div class="flip-card-back p-8 flex flex-col">
        <button onclick="closeCard()" class="self-end text-xs mono text-gray-400 hover:text-white mb-6">✕ ZATVORI</button>
        <div id="back-content" class="flex-1"></div>
      </div>
    </div>
  </div>

  <!-- Wishlist -->
  <div class="max-w-screen-2xl mx-auto px-8 py-16 border-t border-white/10 bg-black">
    <div class="max-w-md mx-auto text-center">
      <h2 class="bebas text-4xl mb-3">Želiš da budeš deo zida?</h2>
      <p class="text-gray-400 mb-8">Pošalji zahtev — bićeš među prvima.</p>
      
      <form id="wishlist-form" class="space-y-6">
        <input type="number" id="pixels" placeholder="Broj piksela (min 1000)" 
               class="w-full bg-transparent border border-white/20 rounded-2xl px-6 py-6 text-center text-xl focus:border-[#00f5c8]">
        <input type="email" id="email" placeholder="tvoj@email.rs" 
               class="w-full bg-transparent border border-white/20 rounded-2xl px-6 py-6 text-center text-xl focus:border-[#00f5c8]">
        <button type="submit" 
                class="w-full bg-[#00f5c8] hover:bg-white text-black font-semibold py-6 rounded-2xl transition-all">
          POŠALJI ZAHTEV
        </button>
      </form>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let scale = 1.15;
    let offsetX = -120;
    let offsetY = -60;
    let isDragging = false;
    let lastX, lastY;

    let occupiedBlocks = [
      {x: 140, y: 110, w: 160, h: 95, color: '#00f5c8', name: "Pivara 011", city: "Beograd", desc: "Najbrže rastuća craft pivara u Srbiji. Ponosimo se srpskim ukusom."},
      {x: 720, y: 260, w: 230, h: 115, color: '#ff4d94', name: "CodeCrafters", city: "Novi Sad", desc: "Moderni softver za srpske kompanije koje žele da rastu."},
      {x: 1320, y: 140, w: 145, h: 145, color: '#00bfff', name: "Neural Balkans", city: "Novi Sad", desc: "Veštačka inteligencija za Balkan."},
      {x: 380, y: 580, w: 175, h: 92, color: '#ffd700', name: "EcoPack", city: "Niš", desc: "Ekološka ambalaža za budućnost."},
    ];

    function draw() {
      ctx.fillStyle = '#04040a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 15000; i++) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.06})`;
        ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 1, 1);
      }

      occupiedBlocks.forEach(block => {
        ctx.fillStyle = block.color + '22';
        ctx.fillRect(block.x, block.y, block.w, block.h);
        ctx.strokeStyle = block.color;
        ctx.lineWidth = 5;
        ctx.strokeRect(block.x, block.y, block.w, block.h);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 23px JetBrains Mono';
        ctx.fillText(block.name, block.x + 22, block.y + 52);
      });
    }

    // Drag & Zoom
    canvas.addEventListener('mousedown', e => { isDragging = true; lastX = e.offsetX; lastY = e.offsetY; });
    canvas.addEventListener('mousemove', e => {
      if (!isDragging) return;
      offsetX += (e.offsetX - lastX) / scale;
      offsetY += (e.offsetY - lastY) / scale;
      lastX = e.offsetX; lastY = e.offsetY;
      draw();
    });
    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.11;
      scale = Math.max(0.5, Math.min(7, scale * delta));
      draw();
    });

    // Click
    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      for (let block of occupiedBlocks) {
        if (clickX > block.x && clickX < block.x + block.w && clickY > block.y && clickY < block.y + block.h) {
          showCard(block, e.clientX, e.clientY);
          break;
        }
      }
    });

    function showCard(block, clientX, clientY) {
      const card = document.getElementById('flip-card');
      card.classList.remove('hidden');
      card.classList.remove('flipped');

      card.style.left = `${clientX - 190}px`;
      card.style.top = `${clientY - 220}px`;

      document.getElementById('front-content').innerHTML = `
        <div style="color:\( {block.color}" class="text-5xl mb-2"> \){block.name}</div>
        <div class="mono text-sm opacity-75">${block.city}</div>
      `;

      document.getElementById('back-content').innerHTML = `
        <h3 class="bebas text-3xl mb-6">${block.name}</h3>
        <p class="text-gray-300 leading-relaxed">${block.desc}</p>
        <div class="mt-10 flex gap-4">
          <button onclick="window.open('https://example.com','_blank')" class="bg-[#00f5c8] text-black px-7 py-3.5 rounded-full font-medium">Poseti sajt →</button>
        </div>
      `;
    }

    function flipCard() {
      document.getElementById('flip-card').classList.add('flipped');
    }

    function closeCard() {
      document.getElementById('flip-card').classList.add('hidden');
    }

    document.getElementById('wishlist-form').addEventListener('submit', e => {
      e.preventDefault();
      alert("✅ Hvala! Kontaktiraćemo te uskoro.");
      e.target.reset();
    });

    draw();
  </script>
</body>
</html>
